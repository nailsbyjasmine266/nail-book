*, *::before, *::after { box-sizing: border-box; }
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html {
  height: 100%;
  scroll-padding-top: env(safe-area-inset-top, 0px);
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
}
html.locked, html.locked body { overflow: hidden; }
body {
  margin: 0;
  min-height: 100%;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 17px;
  line-height: 1.4;
  font-variant-numeric: lining-nums;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; opacity: .35; }
:focus-visible { outline: 2.5px solid var(--gold); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.spark { fill: currentColor; stroke: none; }

.bg-art { position: fixed; inset: 0; z-index: 0; pointer-events: none; display: grid; place-items: center; overflow: hidden; }
.bg-frame {
  position: relative;
  width: min(74vw, 380px); aspect-ratio: 300 / 500;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  border: 1.5px solid var(--wm); border-radius: 999px;
  color: var(--wm); opacity: var(--wm-o);
}
.bg-frame::before { content: ""; position: absolute; inset: 9px; border: 1px solid var(--wm); border-radius: 999px; }
.bg-frame .spark { width: 30px; height: 30px; }
.bg-jasu { font-family: var(--font-script); font-size: clamp(64px, 20vw, 104px); line-height: 1; margin: 12px 0 6px; }
.bg-nails { font-family: var(--font-display); font-weight: 600; font-size: clamp(30px, 9vw, 46px); letter-spacing: .3em; margin-right: -.3em; line-height: 1.1; }
.bg-by { display: flex; align-items: center; gap: 10px; font-size: clamp(11px, 3.2vw, 15px); letter-spacing: .3em; margin: 6px 0 18px; }
.bg-by::before, .bg-by::after { content: ""; width: 26px; border-top: 1px solid currentColor; }

#app {
  position: relative; z-index: 1;
  max-width: 560px;
  margin: 0 auto;
  padding: 0 16px calc(var(--tabbar-h) + 40px);
}
body.onboarding #app { padding-bottom: 40px; }
body.onboarding #tabbar, body.onboarding .bg-art { display: none; }

/* ---------- Home ---------- */
.home-top { display: flex; align-items: center; justify-content: space-between; margin: 10px 0 0; min-height: 60px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-badge { width: 34px; height: 55px; flex: none; }
.brand-words { display: flex; flex-direction: column; min-width: 0; }
.brand-words b { font-family: var(--font-display); font-weight: 600; font-size: 22px; letter-spacing: .28em; line-height: 1.05; color: var(--gold-text); }
.brand-words span { font-size: 11.5px; font-weight: 500; letter-spacing: .3em; color: var(--ink-2); margin-top: 2px; }
.icon-btn {
  width: 44px; height: 44px; flex: none;
  display: grid; place-items: center;
  border: 0; border-radius: 50%;
  background: none; color: var(--ink-2);
}
.icon-btn svg { width: 24px; height: 24px; }
.hero { display: flex; align-items: center; gap: 18px; margin: 6px 0 20px; }
.hero-day {
  font-family: var(--font-display); font-weight: 500;
  font-size: 136px; line-height: .76;
  letter-spacing: -.02em;
  padding-top: .1em;
  min-width: 1.1ch;
}
.hero-side { min-width: 0; }
.hero-month { font-family: var(--font-display); font-weight: 600; font-size: 40px; line-height: 1; }
.hero-wd { font-size: 18px; font-weight: 500; margin-top: 8px; }
.hero-ad { font-size: 15px; color: var(--ink-2); }

.swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.swatch {
  position: relative; overflow: hidden;
  display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start;
  min-height: 108px; padding: 12px 14px 12px;
  border: 0; text-align: left; color: var(--on-gold);
  border-radius: 46% 46% 18px 18px / 34% 34% 18px 18px;
}
.swatch b { font-family: var(--font-display); font-weight: 600; font-size: 42px; line-height: .9; }
.swatch span { font-size: 14px; font-weight: 500; line-height: 1.2; margin-top: 4px; }
.swatch small { font-size: 12px; line-height: 1.2; opacity: .78; }
.sw-a { background: linear-gradient(165deg, var(--gold-hi), var(--gold) 55%, var(--gold-deep)); box-shadow: var(--shadow-gold); }
.sw-b { background: linear-gradient(165deg, var(--nude-hi), var(--nude) 58%, var(--nude-deep)); }
.sw-c { background: linear-gradient(165deg, var(--pale-hi), var(--pale) 58%, var(--pale-deep)); }
.gloss::after {
  content: ""; position: absolute; pointer-events: none;
  top: 10px; left: 18%; width: 11px; height: 34px; border-radius: 8px;
  background: linear-gradient(180deg, rgba(255,255,255,.8), rgba(255,255,255,0));
  transform: rotate(14deg);
}

.sig { display: flex; flex-direction: column; align-items: center; margin: 46px 0 4px; color: var(--gold-text); }
.sig .spark { width: 14px; height: 14px; opacity: .8; }
.sig span { font-family: var(--font-script); font-size: 38px; line-height: 1.1; }

/* ---------- Sections and lists ---------- */
.sec-title { font-family: var(--font-display); font-weight: 600; font-size: 27px; line-height: 1.15; margin: 32px 2px 6px; }
.sec-note { font-size: 15px; color: var(--ink-2); margin: 0 2px 4px; }
.day-head {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  font-size: 15px; font-weight: 500; color: var(--ink-2);
  margin: 16px 4px 7px;
}
.day-head span { font-weight: 400; color: var(--ink-3); font-size: 14px; white-space: nowrap; }
.day-head.big { font-size: 18px; color: var(--ink); margin-top: 22px; }
.month-head { font-family: var(--font-display); font-weight: 600; font-size: 28px; margin: 30px 2px 0; }
.group { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.empty-line { color: var(--ink-3); margin: 6px 4px; font-size: 16px; }
.count-line { color: var(--ink-3); font-size: 14px; margin: 14px 4px 0; }

.row { position: relative; display: flex; align-items: stretch; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 90px; right: 0; height: 1px; background: var(--line); }
.row-body {
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: 12px;
  padding: 12px 4px 12px 12px;
  background: none; border: 0; text-align: left;
}
.row-time { width: 52px; flex: none; display: flex; flex-direction: column; align-items: flex-end; }
.row-time b { font-family: var(--font-display); font-weight: 600; font-size: 24px; line-height: 1; }
.row-time small { font-size: 12px; font-weight: 500; color: var(--ink-3); margin-top: 4px; }
.row-main { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.row-name { font-size: 17px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-meta { font-size: 14px; color: var(--ink-2); display: flex; flex-wrap: wrap; column-gap: 12px; }
.row-money { font-size: 14px; display: flex; flex-wrap: wrap; column-gap: 12px; }
.m-due { color: var(--gold-text); font-weight: 500; }
.m-earned { color: var(--done); font-weight: 500; }
.m-dep { color: var(--ink-2); }
.m-dep.none { color: var(--warn); }
.m-muted { color: var(--ink-3); }
.st-done .row-name { color: var(--ink-2); }
.st-cancelled .row-name { color: var(--ink-3); text-decoration: line-through; }
.st-cancelled .tip { opacity: .35; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; flex: none; }

.tip {
  position: relative; flex: none; align-self: center;
  width: 12px; height: 30px;
  border-radius: 50% 50% 5px 5px / 42% 42% 5px 5px;
  background: var(--tip, var(--line-strong));
}
.tip::after {
  content: ""; position: absolute; left: 3px; top: 6px;
  width: 2.5px; height: 10px; border-radius: 2px;
  background: rgba(255, 255, 255, .65);
}

.check { flex: none; width: 58px; display: grid; place-items: center; background: none; border: 0; }
.check svg { width: 30px; height: 30px; }
.check .c { stroke: var(--line-strong); stroke-width: 2; }
.check .k { stroke: transparent; stroke-width: 2.6; }
.check.on .c { fill: var(--done); stroke: var(--done); }
.check.on .k { stroke: var(--surface); }
.check.just .c { animation: pop .38s cubic-bezier(.3, 1.6, .5, 1); transform-origin: center; transform-box: fill-box; }
.check.just .k { stroke-dasharray: 22; animation: draw .34s .08s ease-out both; }
@keyframes pop { 0% { transform: scale(.7); } 100% { transform: scale(1); } }
@keyframes draw { from { stroke-dashoffset: 22; } to { stroke-dashoffset: 0; } }

.welcome { margin-top: 30px; padding: 22px 20px; background: var(--surface); border: 1px dashed var(--line-strong); border-radius: 22px; }
.welcome h2 { font-family: var(--font-display); font-weight: 600; font-size: 30px; line-height: 1.1; margin: 0 0 8px; }
.welcome p { margin: 0 0 18px; color: var(--ink-2); }

.nudge {
  margin-top: 24px; padding: 12px 12px 12px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: var(--tint); border-radius: 16px;
}
.nudge p { margin: 0; font-size: 15px; color: var(--ink-2); }
.nudge p b { display: block; color: var(--ink); font-size: 16px; font-weight: 500; }
.nudge div { display: flex; align-items: center; flex: none; }
.banner { margin: 12px 0 0; padding: 12px 14px; border-radius: 14px; background: var(--tint); color: var(--ink); font-size: 15px; }

/* ---------- Buttons ---------- */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; min-height: 52px; padding: 10px 18px;
  border: 0; border-radius: 16px;
  font-size: 17px; font-weight: 500; line-height: 1.2; letter-spacing: .01em;
  text-decoration: none;
}
.btn svg { width: 20px; height: 20px; stroke-width: 2; }
.btn-primary {
  position: relative; overflow: hidden;
  color: var(--on-gold);
  background: linear-gradient(170deg, var(--gold-hi), var(--gold) 52%, var(--gold-deep));
  box-shadow: var(--shadow-gold);
}
.btn-secondary { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line-strong); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger-outline { background: none; color: var(--danger); border: 1.5px solid var(--line-strong); }
.btn-text { background: none; border: 0; min-height: 44px; padding: 8px 12px; font-size: 16px; font-weight: 500; color: var(--gold-text); }
.btn-text.warn { color: var(--warn); }
.btn-text.danger { color: var(--danger); }
.btn-small {
  border: 0; border-radius: 12px; min-height: 40px; padding: 6px 14px;
  font-size: 15px; font-weight: 500;
  color: var(--on-gold); background: linear-gradient(170deg, var(--gold-hi), var(--gold));
}
.text-btn { background: none; border: 0; min-height: 44px; padding: 8px 8px; font-size: 17px; font-weight: 500; color: var(--gold-text); }
.pill { border: 1.5px solid var(--line-strong); background: var(--surface); border-radius: 999px; min-height: 36px; padding: 4px 14px; font-size: 15px; font-weight: 500; }
.see-all, .add-day { margin-top: 14px; }
.link { background: none; border: 0; padding: 0; font-size: inherit; font-weight: 500; color: var(--gold-text); }

#tabbar {
  position: fixed; z-index: 20; left: 0; right: 0; bottom: 0;
  padding: 4px 8px calc(4px + env(safe-area-inset-bottom, 0px));
  background: var(--bar-bg);
  -webkit-backdrop-filter: saturate(1.4) blur(18px);
  backdrop-filter: saturate(1.4) blur(18px);
  border-top: 1px solid var(--line);
}
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); max-width: 560px; margin: 0 auto; }
.tab-add { display: flex; align-items: flex-start; justify-content: center; min-height: 50px; border: 0; background: none; padding: 0; }
.tab-add > span {
  position: relative; overflow: hidden;
  display: grid; place-items: center;
  width: 56px; height: 56px; margin-top: -20px; border-radius: 50%;
  color: var(--on-gold);
  background: linear-gradient(160deg, var(--gold-hi), var(--gold) 55%, var(--gold-deep));
  box-shadow: var(--shadow-gold), 0 0 0 5px var(--bg);
}
.tab-add svg { width: 27px; height: 27px; stroke-width: 2.2; }
.tab-add .gloss::after { top: 8px; left: 15px; width: 8px; height: 19px; transform: rotate(30deg); }
.tab {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: 50px; border: 0; background: none;
  color: var(--ink-3); font-size: 11.5px; font-weight: 500;
}
.tab svg { width: 25px; height: 25px; }
.tab[aria-current="page"] { color: var(--gold-text); }

/* ---------- Page headers, segments ---------- */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 18px 2px 16px; min-height: 48px; }
.page-head h1 { font-family: var(--font-display); font-weight: 600; font-size: 44px; line-height: 1; margin: 0; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; padding: 3px; background: var(--surface-2); border-radius: 13px; }
.seg button {
  min-height: 38px; padding: 6px 6px; border: 0; border-radius: 10px;
  background: none; color: var(--ink-2); font-size: 15px; font-weight: 400; line-height: 1.15;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 500; box-shadow: 0 1px 3px rgba(58, 46, 38, .16); }

.search { position: relative; margin-bottom: 12px; }
.search svg { position: absolute; left: 13px; top: 50%; width: 19px; height: 19px; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.search input { padding-left: 40px; }

/* ---------- Calendar ---------- */
.cal-card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 6px 8px 10px; }
.cal-nav { display: flex; align-items: center; justify-content: space-between; margin: 2px 0 6px; }
.cal-title { text-align: center; }
.cal-title b { display: block; font-family: var(--font-display); font-weight: 600; font-size: 28px; line-height: 1.1; }
.cal-title small { font-size: 13px; color: var(--ink-3); }
.wk, .grid { display: grid; grid-template-columns: repeat(7, 1fr); }
.wk span { text-align: center; font-size: 12px; font-weight: 500; color: var(--ink-3); padding: 4px 0 6px; }
.wk span:last-child { color: var(--sat); }
.cell {
  position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  min-height: 56px; padding: 6px 0 14px;
  border: 0; border-radius: 14px; background: none;
}
.cell.blank { pointer-events: none; }
.cell .bsd { font-family: var(--font-display); font-weight: 600; font-size: 24px; line-height: 1; }
.cell .add { font-size: 10.5px; line-height: 1; color: var(--ink-3); margin-top: 3px; white-space: nowrap; }
.cell.is-sat .bsd { color: var(--sat); }
.cell.is-today { box-shadow: inset 0 0 0 1.5px var(--gold); }
.cell.is-sel { background: linear-gradient(165deg, var(--gold-hi), var(--gold) 60%, var(--gold-deep)); box-shadow: none; }
.cell.is-sel .bsd, .cell.is-sel .add { color: var(--on-gold); }
.dots { position: absolute; bottom: 6px; left: 0; right: 0; display: flex; justify-content: center; gap: 3px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--gold-deep); }
.dots b { font-size: 10px; line-height: 1; font-weight: 600; color: var(--gold-text); }
.cell.is-sel .dots i { background: var(--on-gold); }
.cell.is-sel .dots b { color: var(--on-gold); }

/* ---------- Summary ---------- */
.period { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 4px; }
.period-title { text-align: center; }
.period-title b { display: block; font-family: var(--font-display); font-weight: 600; font-size: 29px; line-height: 1.1; }
.period-title small { font-size: 14px; color: var(--ink-3); }
.stat-hero { margin-top: 14px; padding: 18px 18px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; }
.stat-num { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; margin: 0 0 14px; }
.stat-num b { font-family: var(--font-display); font-weight: 600; font-size: 72px; line-height: .85; }
.stat-num span { font-size: 18px; font-weight: 500; color: var(--ink-2); }
.stat-num small { flex-basis: 100%; font-size: 15px; color: var(--ink-3); }
.stack { display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: var(--surface-2); gap: 2px; }
.stack i { display: block; min-width: 0; }
.s-done { background: var(--done); }
.s-booked { background: var(--gold); }
.s-cx { background: var(--line-strong); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; list-style: none; padding: 0; margin: 10px 0 0; font-size: 15px; color: var(--ink-2); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; }
.facts { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.facts div { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; }
.facts div + div { border-top: 1px solid var(--line); }
.facts dt { color: var(--ink-2); font-size: 16px; }
.facts dt small { display: block; font-size: 13px; color: var(--ink-3); line-height: 1.25; }
.facts dd { margin: 0; font-weight: 500; text-align: right; display: flex; align-items: center; gap: 8px; }
.facts .total dt { color: var(--ink); font-weight: 500; }
.facts .total dd { color: var(--gold-text); font-size: 18px; }
.facts.money dd { font-size: 18px; }
.facts.money div:first-child dd { color: var(--done); }
.facts.money div:last-child dd { color: var(--gold-text); }
.bars { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 8px 16px; }
.bar-row { display: grid; grid-template-columns: 104px 1fr 32px; align-items: center; gap: 10px; min-height: 36px; }
.bar-l { font-size: 15px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-t { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar-t i { display: block; height: 100%; border-radius: 999px; }
.bar-n { text-align: right; font-weight: 500; }
.cols {
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; align-items: end;
  height: 150px; padding: 12px 12px 8px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
}
.col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
.col-n { font-size: 12px; font-weight: 500; color: var(--ink-2); min-height: 16px; }
.col-b { width: 100%; max-width: 26px; border-radius: 7px 7px 3px 3px; background: var(--nude); min-height: 3px; }
.col.cur .col-b { background: var(--gold); }
.col-l { font-size: 11px; color: var(--ink-3); margin-top: 5px; white-space: nowrap; }
.empty-block { margin: 18px 4px; color: var(--ink-3); font-size: 16px; }

/* ---------- Sheets ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.scrim { position: absolute; inset: 0; background: var(--scrim); animation: fade .22s ease-out; }
.sheet {
  position: relative; width: 100%; max-width: 560px;
  max-height: calc(100% - env(safe-area-inset-top, 0px) - 10px);
  display: flex; flex-direction: column;
  background: var(--bg);
  border-radius: 24px 24px 0 0;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  animation: up .3s cubic-bezier(.2, .85, .25, 1);
  outline: none;
}
.sheet.tall { height: calc(100% - env(safe-area-inset-top, 0px) - 10px); }
.sheet-wrap.closing .sheet { animation: down .18s ease-in forwards; }
.sheet-wrap.closing .scrim { animation: fade .18s ease-in reverse forwards; }
@keyframes up { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes down { to { transform: translateY(100%); } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.grabber { width: 38px; height: 5px; border-radius: 3px; background: var(--line-strong); margin: 8px auto 0; flex: none; }
.sheet-bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 6px 8px 2px; flex: none; }
.sheet-bar h2 { margin: 0; font-size: 17px; font-weight: 500; text-align: center; }
.sheet-bar > :first-child { justify-self: start; }
.sheet-bar > :last-child { justify-self: end; }
.sheet-scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 4px 18px 28px; flex: 1 1 auto; }
.sheet-scroll.pad-top { padding-top: 14px; }
.sheet-title { font-family: var(--font-display); font-weight: 600; font-size: 30px; line-height: 1.12; margin: 4px 0 8px; }
.sheet-text { color: var(--ink-2); margin: 4px 0 16px; }
.actions { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.actions-row { display: flex; justify-content: space-between; margin-top: 2px; }

.status { display: inline-block; margin: 8px 0 6px; padding: 3px 11px; border-radius: 999px; font-size: 14px; font-weight: 500; background: var(--tint); color: var(--gold-text); }
.status.st-done { background: var(--surface-2); color: var(--done); }
.status.st-cancelled { background: var(--surface-2); color: var(--ink-3); }
.status.st-late { background: var(--surface-2); color: var(--warn); }
.detail-name { font-family: var(--font-display); font-weight: 600; font-size: 38px; line-height: 1.05; margin: 0 0 6px; overflow-wrap: anywhere; }
.detail-when { margin: 0; font-size: 18px; font-weight: 500; }
.detail-ad { margin: 0 0 16px; color: var(--ink-2); font-size: 15px; }
.notes { margin-top: 14px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }
.notes h3 { margin: 0 0 2px; font-size: 14px; font-weight: 500; color: var(--ink-3); }
.notes p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.returning { margin: 12px 4px 0; font-size: 15px; color: var(--ink-2); }
.call { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 4px 14px; border-radius: 999px; background: var(--tint); color: var(--gold-text); font-size: 15px; font-weight: 500; text-decoration: none; }
.call svg { width: 16px; height: 16px; stroke-width: 2; }

/* ---------- Form ---------- */
.field { display: block; margin: 16px 0 0; padding: 0; border: 0; min-width: 0; }
.field-row { display: grid; grid-template-columns: 1.45fr 1fr; gap: 10px; }
.field-row .field { margin-top: 16px; }
.lbl { display: block; margin: 0 0 6px 2px; font-size: 14px; font-weight: 500; color: var(--ink-2); }
.opt { font-weight: 400; color: var(--ink-3); }
.input {
  display: block; width: 100%; min-height: 50px;
  padding: 11px 13px;
  font: 400 17px/1.3 var(--font-ui); color: var(--ink);
  background: var(--surface);
  border: 1.5px solid var(--line-strong); border-radius: 13px;
  -webkit-appearance: none; appearance: none;
}
textarea.input { resize: vertical; min-height: 84px; }
.input::placeholder { color: var(--ink-3); }
.input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px var(--focus); }
input[type="time"].input { text-align: left; }
input[type="time"]::-webkit-date-and-time-value { text-align: left; }
.date-btn { text-align: left; display: flex; flex-direction: column; justify-content: center; gap: 1px; padding-top: 6px; padding-bottom: 6px; }
.date-btn b { font-weight: 500; font-size: 17px; line-height: 1.2; }
.date-btn small { font-size: 13px; color: var(--ink-3); line-height: 1.2; }
.dayload { margin: 8px 3px 0; font-size: 14px; color: var(--ink-3); }
.dayload .clash { color: var(--warn); font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.grid2 { display: grid; grid-template-columns: 1fr 1fr; }
.chip {
  display: inline-flex; align-items: center; gap: 9px;
  min-height: 46px; padding: 8px 14px;
  border: 1.5px solid var(--line-strong); border-radius: 999px;
  background: var(--surface); color: var(--ink);
  font-size: 16px; font-weight: 400; text-align: left;
}
.chip .tip { width: 10px; height: 24px; }
.chip[aria-pressed="true"] { border-color: var(--gold); background: var(--tint); font-weight: 500; box-shadow: inset 0 0 0 1px var(--gold); }
.stepper { display: inline-flex; align-items: center; background: var(--surface); border: 1.5px solid var(--line-strong); border-radius: 999px; padding: 3px; }
.stepper button { width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--tint); color: var(--gold-text); font-size: 24px; line-height: 1; }
.stepper output { min-width: 64px; text-align: center; font-family: var(--font-display); font-weight: 600; font-size: 26px; }
.money-in { position: relative; display: block; }
.money-in .sym { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-weight: 500; color: var(--ink-2); pointer-events: none; }
.dep-amt { display: block; margin-top: 12px; }
.balance { margin: 12px 3px 0; font-size: 15px; color: var(--ink-2); min-height: 1px; }
.balance b { color: var(--gold-text); font-weight: 500; }
.err { display: none; margin: 6px 3px 0; font-size: 14px; font-weight: 500; color: var(--danger); }
.err.on { display: block; }
.field.has-err .input, .field.has-err .chip { border-color: var(--danger); }
.save { margin-top: 24px; }

.set-block { margin-top: 28px; }
.set-block h3 { margin: 0 0 4px; font-family: var(--font-display); font-size: 23px; font-weight: 600; }

  padding: 9px 10px 9px 16px; border-radius: 14px;

  font-size: 15px; font-weight: 400;
  box-shadow: 0 10px 28px -10px rgba(0, 0, 0, .45);
  transition: opacity .2s, transform .2s;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }

<script>
(function () {
'use strict';

/* ================= Nepali (Bikram Sambat) calendar ================= */
/* BS:BEGIN */
// Month lengths for BS 2070-2098 (AD 2013-2042). One row per year; each digit is (days - 29).
// Cross-checked against four independent BS calendar tables; 2084-2087 use the 3-of-4 majority.
var BS_FIRST_YEAR = 2070;
var BS_TABLE = '222322011011|223222101011|232321101011|232321110012|222322101011|223222101011|232321110011|232321110102|222322101011|223222101011|232321110011|232321110102|223222101011|223222101011|223221110111|232312110111|132321110111|223222110111|123312110111|132321110111|132321110111|223222110111|123321110111|132321110111|223221110111|223222101111|123321101011|232321110111|223222010102'
  .split('|').map(function (r) { return r.split('').map(function (c) { return 29 + Number(c); }); });
var BS_LAST_YEAR = BS_FIRST_YEAR + BS_TABLE.length - 1;
var DAY_MS = 86400000;
var EPOCH_DAY = Date.UTC(2013, 3, 14) / DAY_MS; // 1 Baisakh 2070 = 14 April 2013
var YEAR_START = [];
var acc = EPOCH_DAY;
BS_TABLE.forEach(function (row) { YEAR_START.push(acc); acc += row.reduce(function (a, b) { return a + b; }, 0); });
var MIN_DAY = EPOCH_DAY, MAX_DAY = acc - 1;

function bsDaysIn(y, m) { return BS_TABLE[y - BS_FIRST_YEAR][m - 1]; }
function bsToDay(y, m, d) {
  var row = BS_TABLE[y - BS_FIRST_YEAR], dn = YEAR_START[y - BS_FIRST_YEAR];
  for (var k = 0; k < m - 1; k++) dn += row[k];
  return dn + d - 1;
}
function dayToBs(dn) {
  dn = Math.min(MAX_DAY, Math.max(MIN_DAY, dn));
  var i = YEAR_START.length - 1;
  while (i > 0 && YEAR_START[i] > dn) i--;
  var rem = dn - YEAR_START[i], m = 0;
  while (rem >= BS_TABLE[i][m]) { rem -= BS_TABLE[i][m]; m++; }
  return { y: BS_FIRST_YEAR + i, m: m + 1, d: rem + 1 };
}
/* BS:END */

var pad2 = function (n) { return String(n).padStart(2, '0'); };
function todayDay() { var n = new Date(); return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) / DAY_MS; }
function isoToDay(iso) { var p = iso.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]) / DAY_MS; }
function dayToIso(dn) { var d = new Date(dn * DAY_MS); return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate()); }
function weekdayOf(dn) { return new Date(dn * DAY_MS).getUTCDay(); }
function adParts(dn) { var d = new Date(dn * DAY_MS); return { y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate() }; }

var AD_M_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
var AD_M_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
var M_EN = ['Baisakh', 'Jestha', 'Asar', 'Shrawan', 'Bhadra', 'Asoj', 'Kartik', 'Mangsir', 'Poush', 'Magh', 'Falgun', 'Chaitra'];
var M_NE = ['बैशाख', 'जेठ', 'असार', 'साउन', 'भदौ', 'असोज', 'कात्तिक', 'मंसिर', 'पुस', 'माघ', 'फागुन', 'चैत'];
var M_EN_S = ['Bai', 'Jes', 'Asa', 'Shr', 'Bha', 'Aso', 'Kar', 'Man', 'Pou', 'Mag', 'Fal', 'Cha'];
var M_NE_S = ['बै', 'जे', 'असा', 'सा', 'भ', 'असो', 'का', 'मं', 'पु', 'मा', 'फा', 'चै'];
var W_EN = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
var W_NE = ['आइतबार', 'सोमबार', 'मंगलबार', 'बुधबार', 'बिहीबार', 'शुक्रबार', 'शनिबार'];
var W_EN_S = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
var W_NE_S = ['आइत', 'सोम', 'मंगल', 'बुध', 'बिही', 'शुक्र', 'शनि'];
var REL = { en: ['Today', 'Tomorrow', 'Yesterday'], ne: ['आज', 'भोलि', 'हिजो'] };
var NE_DIGITS = '०१२३४५६७८९';

var BRAND = 'Nails by Jasmine';
var SERVICES = [
  { id: 'one', label: 'One hand', color: 'var(--svc-one)' },
  { id: 'both', label: 'Both hands', color: 'var(--svc-both)' },
  { id: 'feet', label: 'Feet', color: 'var(--svc-feet)' },
  { id: 'hf', label: 'Hands + feet', color: 'var(--svc-hf)' }
];
var SOURCES = [
  { id: 'tiktok', label: 'TikTok' },
  { id: 'instagram', label: 'Instagram' },
  { id: 'whatsapp', label: 'WhatsApp' },
  { id: 'other', label: 'Other' }
];
var CURRENCIES = ['Rs', '$', 'A$', '£', '€'];
var SUPPLIES = ['Gel polish', 'Nail polish', 'Base and top coat', 'Builder gel', 'Acrylic powder', 'Acrylic liquid', 'Press-on tips',
  'Nail glue', 'Files and buffers', 'Cuticle oil', 'Acetone and remover', 'Cotton pads and wipes', 'Nail art (gems, foils, stickers)',
  'Brushes', 'UV/LED lamp', 'Drill and bits', 'Gloves and masks', 'Towels and tissues', 'Sanitiser and disinfectant', 'Hand cream and lotion'];
var ALERTS = [[0, 'None'], [30, '30 min'], [60, '1 hour'], [120, '2 hours'], [1440, '1 day']];

/* ================= State and storage ================= */
var STORE_KEY = 'nailbook:v1';
function defaultSettings() {
  return { currency: 'Rs', dateLang: 'en', setupDone: false, lastBackupAt: 0, nudgeAt: 0, lastSource: '',
    workStart: '10:00', workEnd: '19:00', daysOff: [], svcLen: { one: 45, both: 90, feet: 60, hf: 150 }, ccode: '', calAlert: 60 };
}
var S = { settings: defaultSettings(), items: [], expenses: [] };
var UI = { tab: 'home', calView: 'month', filter: 'upcoming', q: '', cq: '', cal: null, calSel: null, sum: 'month', sumAnchor: null,
  draft: null, editing: false, pk: null, justDone: null, undo: null, ft: null, wa: null, fin: null, xd: null, xEditing: false, backup: null };
var storageOK = true, persistAsked = false;

function uid(p) { return (p || 'b') + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function numOrNull(v) { if (v === null || v === undefined || v === '') return null; var n = Number(v); return isFinite(n) && n >= 0 ? Math.round(n * 100) / 100 : null; }
function validDate(date) { if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return false; var dn = isoToDay(date); return isFinite(dn) && dn >= MIN_DAY && dn <= MAX_DAY; }

function cleanItem(x) {
  if (!x || typeof x !== 'object') return null;
  var name = String(x.name || '').trim().slice(0, 80);
  var date = String(x.date || '');
  if (!name || !validDate(date)) return null;
  var dep = numOrNull(x.deposit) || 0;
  var depTaken = !!x.depositTaken && dep > 0;
  var status = ['booked', 'done', 'cancelled'].indexOf(x.status) >= 0 ? x.status : 'booked';
  var ppl = parseInt(x.people, 10), dur = parseInt(x.duration, 10);
  return {
    id: String(x.id || uid()).slice(0, 40),
    name: name,
    date: date,
    time: /^\d{2}:\d{2}$/.test(x.time || '') ? x.time : '',
    people: isFinite(ppl) && ppl >= 1 ? Math.min(ppl, 20) : 1,
    duration: isFinite(dur) && dur >= 15 ? Math.min(dur, 720) : 0,
    phone: String(x.phone || '').replace(/[^0-9+()\-\s]/g, '').replace(/\s+/g, ' ').trim().slice(0, 30),
    service: SERVICES.some(function (s) { return s.id === x.service; }) ? x.service : '',
    source: SOURCES.some(function (s) { return s.id === x.source; }) ? x.source : 'other',
    price: numOrNull(x.price),
    depositTaken: depTaken,
    deposit: depTaken ? dep : 0,
    notes: String(x.notes || '').slice(0, 500),
    status: status,
    depositKept: status === 'cancelled' && !!x.depositKept,
    payMethod: String(x.payMethod || '').slice(0, 30),
    tip: numOrNull(x.tip),
    photos: Array.isArray(x.photos) ? x.photos.filter(function (p) { return typeof p === 'string' && p; }).slice(0, 24) : [],
    createdAt: Number(x.createdAt) || Date.now(),
    updatedAt: Number(x.updatedAt) || Date.now()
  };
}
function cleanExpense(x) {
  if (!x || typeof x !== 'object') return null;
  var item = String(x.item || '').trim().slice(0, 60), date = String(x.date || ''), amount = numOrNull(x.amount);
  if (!item || amount === null || amount <= 0 || !validDate(date)) return null;
  return { id: String(x.id || uid('e')).slice(0, 40), item: item, amount: amount, date: date, note: String(x.note || '').slice(0, 300),
    createdAt: Number(x.createdAt) || Date.now(), updatedAt: Number(x.updatedAt) || Date.now() };
}
function mergeSettings(st) {
  if (!st || typeof st !== 'object') return;
  Object.keys(st).forEach(function (k) { if (k !== 'svcLen' && k !== 'salon') S.settings[k] = st[k]; });
  if (st.svcLen) SERVICES.forEach(function (s) { var v = parseInt(st.svcLen[s.id], 10); if (v >= 15 && v <= 720) S.settings.svcLen[s.id] = v; });
  if (!Array.isArray(S.settings.daysOff)) S.settings.daysOff = [];
  if (!/^\d{2}:\d{2}$/.test(S.settings.workStart)) S.settings.workStart = '10:00';
  if (!/^\d{2}:\d{2}$/.test(S.settings.workEnd)) S.settings.workEnd = '19:00';
}
function loadStore() {
  var raw = null;
  try { raw = localStorage.getItem(STORE_KEY); } catch (e) { storageOK = false; return; }
  if (!raw) return;
  try {
    var d = JSON.parse(raw);
    if (d && d.settings) mergeSettings(d.settings);
    if (d && Array.isArray(d.items)) S.items = d.items.map(cleanItem).filter(Boolean);
    if (d && Array.isArray(d.expenses)) S.expenses = d.expenses.map(cleanExpense).filter(Boolean);
  } catch (e) {
    try { localStorage.setItem(STORE_KEY + ':unreadable:' + Date.now(), raw); } catch (e2) {}
  }
}
function saveStore() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ v: 3, settings: S.settings, items: S.items, expenses: S.expenses }));
    storageOK = true;
  } catch (e) { storageOK = false; }
  if (!persistAsked) {
    persistAsked = true;
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {}); } catch (e) {}
  }
  UI.backup = null;
  renderBanner();
}

/* ================= Photos (kept in IndexedDB on this phone) ================= */
var photoURLs = {}, idbP = null;
function idb() {
  if (!idbP) idbP = new Promise(function (res, rej) {
    try {
      var r = indexedDB.open('nailbook-photos', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('photos', { keyPath: 'id' }); };

var sheets = [];

function pushSheet(sh) {

      '<p>Everything is saved on this phone only. Save a backup now and then so you can get it back on a new phone, or if Safari’s data gets cleared. The backup file includes photos.</p>' +
      '<p class="fine">Last backup: ' + relDays(s.lastBackupAt) + '.</p>' +
      '<div class="actions"><button class="btn btn-secondary" data-act="bk-file"' + (ready ? '' : ' disabled') + '>' + (ready ? 'Save backup file' : 'Preparing backup…') + '</button>' +
      '<button class="btn btn-secondary" data-act="bk-copy">Copy backup text (no photos)</button>' +
      '<button class="btn btn-secondary" data-act="bk-restore">Restore from backup</button></div></section>' +
    (standalone ? '' : '<section class="set-block"><h3>Add to Home Screen</h3><p>Open this page in Safari, tap the Share button, then choose Add to Home Screen. After that it opens like an app, even without internet.</p></section>') +
    '<section class="set-block"><h3>Start over</h3><p>Delete every booking, expense and photo from this phone.</p>' +
      '<div class="actions"><button class="btn btn-danger-outline" data-act="wipe"' + (S.items.length || S.expenses.length ? '' : ' disabled') + '>Delete everything</button></div></section>' +
    '<footer class="sig">' + I.spark + '<span>Jasu</span></footer>' +
  '</div>';
}
function mountSettings(root) {
  var op = root.querySelector('#s-open'), cl = root.querySelector('#s-close'), cc = root.querySelector('#s-cc');
  on(op, 'change', function () { if (/^\d{2}:\d{2}$/.test(op.value)) { S.settings.workStart = op.value; saveStore(); prepareBackup(); } });
  on(cl, 'change', function () { if (/^\d{2}:\d{2}$/.test(cl.value)) { S.settings.workEnd = cl.value; saveStore(); prepareBackup(); } });
  on(cc, 'input', function () { S.settings.ccode = cc.value.replace(/\D/g, '').slice(0, 4); saveStore(); prepareBackup(); });
}

/* ---------- Backup and restore ---------- */
var dlNS = null;
try {
  if (window.claude && typeof window.claude.use === 'function') window.claude.use('downloads').then(function (ns) { dlNS = ns || null; }, function () {});
} catch (e) {}
function bufToB64(buf) { var bytes = new Uint8Array(buf), s = '', CH = 0x8000; for (var i = 0; i < bytes.length; i += CH) s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH)); return btoa(s); }
function b64ToBuf(b64) { var s = atob(b64), bytes = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) bytes[i] = s.charCodeAt(i); return bytes.buffer; }
function backupBase() {
  var st = S.settings;
  return { app: 'nail-book', version: 3, exportedAt: new Date().toISOString(),
    settings: { currency: st.currency, dateLang: st.dateLang, workStart: st.workStart, workEnd: st.workEnd, daysOff: st.daysOff, svcLen: st.svcLen, ccode: st.ccode, calAlert: st.calAlert },
    items: S.items, expenses: S.expenses };
}
function prepareBackup() {
  var token = {};
  UI.backup = token;
  var used = {};
  S.items.forEach(function (i) { i.photos.forEach(function (p) { used[p] = 1; }); });
  var base = backupBase();
  var finish = function (photos) {
    if (UI.backup !== token) return;
    base.photos = photos;
    token.text = JSON.stringify(base);
    var sh = topSheet();
    if (sh && sh.render === renderSettings) renderSheet(sh);
  };
  if (!Object.keys(used).length) { finish([]); return; }
  photoAll().then(function (recs) {
    finish((recs || []).filter(function (r) { return used[r.id]; }).map(function (r) { return { id: r.id, type: r.type, w: r.w, h: r.h, createdAt: r.createdAt, data: bufToB64(r.data) }; }));
  }, function () { finish([]); });
}
function markBackedUp() { S.settings.lastBackupAt = Date.now(); saveStore(); prepareBackup(); refresh(); }
function saveBackupFile() {
  if (!UI.backup || !UI.backup.text) { prepareBackup(); toast('Preparing backup, try again in a moment'); return; }
  var text = UI.backup.text, b = dayToBs(todayDay());
  var filename = 'nails-by-jasmine-backup-' + b.y + '-' + pad2(b.m) + '-' + pad2(b.d) + '.json';
  if (dlNS) {
    dlNS.save({ filename: filename, data: text }).then(function () { markBackedUp(); toast('Backup saved'); }, function (e) {
      var c = e && e.code;
      if (c === 'declined') toast('Backup not saved'); else if (c === 'rate_limited') toast('A save is already open'); else openCopySheet();
    });
    return;
  }
  if (!framed) {
    try {
      var file = new File([text], filename, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: 'Nails by Jasmine backup' }).then(function () { markBackedUp(); toast('Backup shared'); }, function (e) {
          if (!e || e.name !== 'AbortError') openCopySheet();
        });
        return;
      }
    } catch (e) {}
    try {
      var url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
      markBackedUp(); toast('Backup downloaded');
      return;
    } catch (e) {}
  }
  openCopySheet();
}
function openCopySheet() {
  pushSheet({ tall: true, live: false, label: 'Backup text', render: function () {
    return '<div class="sheet-bar"><button class="text-btn" data-act="close">Close</button><h2>Backup text</h2><span></span></div>' +
      '<div class="sheet-scroll"><p class="sheet-text">Copy this and keep it somewhere safe, like Notes or a WhatsApp chat with yourself. To get your bookings back, paste it into Restore from backup. Photos are only in the backup file.</p>' +
      '<textarea id="bk-text" class="input backup-text" rows="9" spellcheck="false" aria-label="Backup text">' + esc(JSON.stringify(backupBase())) + '</textarea>' +
      '<div class="actions"><button class="btn btn-primary" data-act="copy-now">Copy backup text</button></div></div>';
  } });
}
function copyText(text, ta, ok) {
  var fallback = function () {
    var done = false;
    if (ta) { try { ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length); done = document.execCommand('copy'); } catch (e) {} }
    if (done) ok(); else toast('Select all the text, then tap Copy');
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(ok, fallback); return; }
  } catch (e) {}
  fallback();
}
function openRestore() {
  pushSheet({ tall: true, live: false, label: 'Restore from backup', render: function () {
    return '<div class="sheet-bar"><button class="text-btn" data-act="close">Cancel</button><h2>Restore</h2><span></span></div>' +
      '<div class="sheet-scroll"><p class="sheet-text">Choose a backup file, or paste backup text. What’s already on this phone stays, and matching bookings are updated.</p>' +
      '<label class="btn btn-secondary file-btn">Choose backup file<input id="rs-file" type="file" accept=".json,.txt,application/json,text/plain"></label>' +
      '<label class="field"><span class="lbl">Or paste backup text</span><textarea id="rs-text" class="input backup-text" rows="7" spellcheck="false" placeholder="Paste here"></textarea></label>' +
      '<p class="err" id="rs-err"></p>' +
      '<div class="actions"><button class="btn btn-primary" data-act="rs-go">Restore</button></div></div>';
  }, mount: function (root) {
    var f = root.querySelector('#rs-file');
    on(f, 'change', function () {
      var file = f.files && f.files[0];
      if (!file) return;
      var r = new FileReader();
      r.onload = function () { doRestore(String(r.result || '')); };
      r.onerror = function () { restoreErr('That file couldn’t be read. Try again, or paste the backup text.'); };
      r.readAsText(file);
    });
  } });
}
function restoreErr(msg) { var e = $('#rs-err'); if (e) { e.textContent = msg; e.classList.add('on'); } }
function doRestore(text) {
  var data;
  try { data = JSON.parse(String(text).trim()); } catch (e) { restoreErr('This isn’t backup text from this app. Paste the whole backup, starting with {"app":"nail-book"'); return; }
  var arr = Array.isArray(data) ? data : data && Array.isArray(data.items) ? data.items : null;
  if (!arr) { restoreErr('No bookings were found in this backup.'); return; }
  var added = 0, updated = 0, xAdded = 0;
  arr.forEach(function (raw) {
    var x = cleanItem(raw);
    if (!x) return;
    var cur = findItem(x.id);
    if (!cur) { S.items.push(x); added++; }
    else if ((x.updatedAt || 0) > (cur.updatedAt || 0)) { Object.assign(cur, x); updated++; }
  });
  (data.expenses || []).forEach(function (raw) {
    var x = cleanExpense(raw);
    if (!x) return;
    var cur = findExpense(x.id);
    if (!cur) { S.expenses.push(x); xAdded++; }
    else if ((x.updatedAt || 0) > (cur.updatedAt || 0)) Object.assign(cur, x);
  });
  var photos = Array.isArray(data.photos) ? data.photos : [];
  var chain = Promise.resolve(), nPhotos = 0;
  photos.forEach(function (p) {
    if (!p || !p.id || !p.data) return;
    chain = chain.then(function () {
      return photoLoad(p.id).then(function (have) {
        if (have) return;
        return photoSave({ id: String(p.id), type: p.type || 'image/jpeg', w: p.w, h: p.h, createdAt: p.createdAt || Date.now(), data: b64ToBuf(p.data) }).then(function () { nPhotos++; });
      }).catch(function () {});
    });
  });
  chain.then(function () {
    saveStore(); closeSheet(); refresh();
    var parts = [];
    if (added || updated) parts.push(added + (added === 1 ? ' booking' : ' bookings') + (updated ? ' (' + updated + ' updated)' : ''));
    if (xAdded) parts.push(xAdded + (xAdded === 1 ? ' expense' : ' expenses'));
    if (nPhotos) parts.push(nPhotos + (nPhotos === 1 ? ' photo' : ' photos'));
    toast(parts.length ? 'Restored ' + parts.join(', ') : 'Everything in that backup is already here');
  });
}
function openWipe() {
  pushSheet({ live: false, label: 'Delete everything', render: function () {
    return '<div class="grabber"></div><div class="sheet-scroll pad-top"><h2 class="sheet-title">Delete everything?</h2>' +
      '<p class="sheet-text">This removes ' + S.items.length + (S.items.length === 1 ? ' booking' : ' bookings') + ', ' + S.expenses.length + (S.expenses.length === 1 ? ' expense' : ' expenses') + ' and their photos from this phone. Save a backup first if you might need them later.</p>' +
      '<div class="actions"><button class="btn btn-danger" data-act="wipe-go">Delete everything</button><button class="btn-text" data-act="close">Keep them</button></div></div>';
  } });
}

/* ================= Actions ================= */
var toastTimer = 0;
function toast(msg, undo) {
  var el = $('#toast');
  el.innerHTML = '<span>' + esc(msg) + '</span>' + (undo ? '<button type="button" data-act="undo">Undo</button>' : '');
  UI.undo = undo || null;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, undo ? 5500 : 2800);
}
function hideToast() { var el = $('#toast'); if (el) el.classList.remove('show'); UI.undo = null; }

function setStatus(id, status, extra) {
  var it = findItem(id);
  if (!it) return;
  var before = Object.assign({}, it);
  Object.assign(it, extra || {}, { status: status, updatedAt: Date.now() });
  if (status !== 'cancelled') it.depositKept = false;
  saveStore();
  refresh();
  var msg = status === 'done' ? firstName(it.name) + ' marked done' : status === 'cancelled' ? 'Booking cancelled' : 'Moved back to booked';
  toast(msg, function () { var cur = findItem(id); if (cur) { Object.assign(cur, before, { updatedAt: Date.now() }); saveStore(); refresh(); } });
}
function toggleDone(id) {
  var it = findItem(id);
  if (!it) return;
  if (it.status === 'done') setStatus(id, 'booked');
  else { UI.justDone = id; setStatus(id, 'done'); }
}
function deleteItem(id) {
  var idx = -1;
  for (var i = 0; i < S.items.length; i++) if (S.items[i].id === id) idx = i;
  if (idx < 0) return;
  var removed = S.items.splice(idx, 1)[0];
  saveStore();
  refresh();
  toast('Booking deleted', function () { if (!findItem(removed.id)) { S.items.push(removed); saveStore(); refresh(); } });
  scheduleCleanup();
}
function syncPressed(act, v) { $$('[data-act="' + act + '"]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === v)); }); }

var ACTIONS = {
  tab: function (el) { goTab(el.dataset.tab); },
  add: function () { openForm(null, UI.tab === 'calendar' && UI.calView === 'month' ? UI.calSel : todayDay()); },
  settings: openSettings,
  close: closeSheet,
  undo: function () { var u = UI.undo; hideToast(); if (u) u(); },
  open: function (el, id) { openDetail(id); },
  'toggle-done': function (el, id) { toggleDone(id); },
  'go-cal-today': function () { var t = todayDay(), b = dayToBs(t); UI.cal = { y: b.y, m: b.m }; UI.calSel = t; UI.calView = 'month'; goTab('calendar'); },
  'go-summary': function (el, id, v) { UI.sum = v; UI.sumAnchor = todayDay(); goTab('summary'); },
  'see-upcoming': function () { UI.calView = 'list'; UI.filter = 'upcoming'; UI.q = ''; goTab('calendar'); },
  'd-finish': function (el, id) { openFinish(id); },
  'fin-pay': function (el, id, v) { UI.fin.method = UI.fin.method === v ? '' : v; syncPressed('fin-pay', UI.fin.method); },
  'fin-done': function (el, id) { var tip = $('#fin-tip'), t = tip ? parseAmount(tip.value) : null; closeSheet(); UI.justDone = id; setStatus(id, 'done', { payMethod: UI.fin.method, tip: t }); },
  'pay': function (el, id, v) { var it = findItem(id); if (!it) return; it.payMethod = it.payMethod === v ? '' : v; it.updatedAt = Date.now(); saveStore(); refresh(); },
  'd-undone': function (el, id) { setStatus(id, 'booked'); },
  'd-edit': function (el, id) { var it = findItem(id); if (it) openForm(it); },
  'd-cancel': function (el, id) { openCancel(id); },
  'd-delete': function (el, id) { deleteItem(id); },
  'cx-keep': function (el, id) { closeSheet(); setStatus(id, 'cancelled', { depositKept: true }); },
  'cx-refund': function (el, id) { closeSheet(); setStatus(id, 'cancelled', { depositKept: false }); },
  'wa-open': function (el, id) { openWa(id); },
  'wa-kind': function (el, id, v) { UI.wa.kind = v; renderSheet(topSheet()); },
  'cal-file': function (el, id) { addToCalendar(id); },
  'copy-text': function (el, id, v) { var ta = document.getElementById(v); if (ta) copyText(ta.value, ta, function () { toast('Message copied'); }); },
  'photo-view': function (el, id, v) { openPhoto(id, v); },
  'photo-del': function (el, id, v) { deletePhoto(id, v); },
  'photo-share': function (el, id) { sharePhoto(id); },
  client: function (el, id, v) { openClient(v); },
  'client-book': function (el, id, v) { var c = findClient(v); if (c) openForm(null, todayDay(), { name: c.name, phone: c.phone, source: c.source, service: c.service }); },
  'f-sugg': function (el, id, v) {
    var c = findClient(v), d = UI.draft;
    if (!c || !d) return;
    d.name = c.name; if (!d.phone) d.phone = c.phone; if (!d.source) d.source = c.source; if (!d.service) d.service = c.service;
    var nm = $('#f-name'); if (nm) nm.value = d.name;
    var ph = $('#f-phone'); if (ph) ph.value = d.phone;
    syncPressed('f-svc', d.service); syncPressed('f-src', d.source); setErr('name'); setErr('service'); setErr('source');
    updateSugg(); updateDur();
  },
  'f-svc': function (el, id, v) { UI.draft.service = v; syncPressed('f-svc', v); setErr('service'); updateDur(); },
  'f-src': function (el, id, v) { UI.draft.source = v; syncPressed('f-src', v); setErr('source'); },
  'f-ppl': function (el, id, v) { setPeople((UI.draft.people || 1) + (+v)); },
  'f-dur': function (el, id, v) { var d = UI.draft; d.duration = Math.max(15, Math.min(720, draftDur() + (+v))); d.durTouched = true; updateDur(); },
  'f-dep': function (el, id, v) {
    UI.draft.depositTaken = v === 'yes';
    syncPressed('f-dep', v);
    var w = $('#f-dep-wrap');
    if (w) w.hidden = !UI.draft.depositTaken;
    setErr('dep'); updateBalance();
    if (UI.draft.depositTaken) { var inp = $('#f-dep'); if (inp) try { inp.focus(); } catch (e) {} }
  },
  'f-date': function () { openPicker(UI.draft.date, function (dn) { UI.draft.date = dayToIso(dn); var btn = $('#f-date'); if (btn) btn.innerHTML = dateBtnInner(UI.draft.date); updateDayLoad(); }); },
  'f-save': saveDraft,
  'pk-prev': function () { var n = stepMonth(UI.pk, -1); if (n) { UI.pk.y = n.y; UI.pk.m = n.m; renderSheet(topSheet()); } },
  'pk-next': function () { var n = stepMonth(UI.pk, 1); if (n) { UI.pk.y = n.y; UI.pk.m = n.m; renderSheet(topSheet()); } },
  'pk-today': function () { pickDay(todayDay()); },
  'pk-day': function (el) { pickDay(+el.dataset.day); },
  'cal-view': function (el, id, v) { UI.calView = v; renderView(); },
  'cal-prev': function () { shiftCal(-1); },
  'cal-next': function () { shiftCal(1); },
  'cal-today': function () { var t = todayDay(), b = dayToBs(t); UI.cal = { y: b.y, m: b.m }; UI.calSel = t; renderView(); },
  'cal-day': function (el) { UI.calSel = +el.dataset.day; renderView(); },
  'cal-add': function () { openForm(null, UI.calSel); },
  filter: function (el, id, v) { UI.filter = v; renderView(); },
  'free-open': function () { openFree(); },
  'free-day': function () { openFree(UI.calSel); },
  'ft-mode': function (el, id, v) { UI.ft.mode = v; renderSheet(topSheet()); },
  'ft-share': function () { var ta = $('#ft-text'); if (ta && navigator.share) navigator.share({ text: ta.value }).catch(function () {}); },
  'sum-mode': function (el, id, v) { UI.sum = v; renderView(); },
  'sum-prev': function () { shiftSum(-1); },
  'sum-next': function () { shiftSum(1); },
  'sum-now': function () { UI.sumAnchor = todayDay(); renderView(); },
  'exp-add': function () { var r = periodRange(UI.sum, UI.sumAnchor), t = todayDay(); openExpense(null, t >= r[0] && t <= r[1] ? t : r[0]); },
  'exp-open': function (el, id) { var e = findExpense(id); if (e) openExpense(e); },
  'x-item': function (el, id, v) { UI.xd.item = v; var inp = $('#x-item'); if (inp) inp.value = v; syncPressed('x-item', v); setErr('x-item'); },
  'x-date': function () { openPicker(UI.xd.date, function (dn) { UI.xd.date = dayToIso(dn); var btn = $('#x-date'); if (btn) btn.innerHTML = dateBtnInner(UI.xd.date); }); },
  'x-save': saveExpense,
  'x-delete': function (el, id) {
    var idx = -1;
    for (var i = 0; i < S.expenses.length; i++) if (S.expenses[i].id === id) idx = i;
    if (idx < 0) return;
    var removed = S.expenses.splice(idx, 1)[0];
    saveStore(); closeSheet(); refresh();
    toast('Expense deleted', function () { if (!findExpense(removed.id)) { S.expenses.push(removed); saveStore(); refresh(); } });
  },
  'set-cur': function (el, id, v) { S.settings.currency = v; saveStore(); prepareBackup(); refresh(); },
  'set-lang': function (el, id, v) { S.settings.dateLang = v; saveStore(); prepareBackup(); refresh(); },
  'set-alert': function (el, id, v) { S.settings.calAlert = +v; saveStore(); prepareBackup(); refresh(); },
  'day-off': function (el, id, v) {

  },
  len: function (el, id, v) {

    saveStore(); prepareBackup(); refresh();
  },
  'bk-file': saveBackupFile,
  'bk-copy': openCopySheet,
  'bk-restore': openRestore,
  'copy-now': function () { var ta = $('#bk-text'); copyText(ta ? ta.value : JSON.stringify(backupBase()), ta, function () { markBackedUp(); toast('Copied. Paste it somewhere safe.'); }); },
  'rs-go': function () { var ta = $('#rs-text'); if (!ta || !ta.value.trim()) { restoreErr('Choose a backup file, or paste the backup text first.'); return; } doRestore(ta.value); },
  wipe: openWipe,
  'wipe-go': function () {
    var prevItems = S.items.slice(), prevExp = S.expenses.slice();
    S.items = []; S.expenses = [];
    saveStore(); closeSheet(); refresh();
    toast('Everything deleted', function () { S.items = prevItems; S.expenses = prevExp; saveStore(); refresh(); });
    scheduleCleanup();
  },
  'nudge-later': function () { S.settings.nudgeAt = Date.now(); saveStore(); renderView(); },
  'ob-cur': function (el, id, v) { S.settings.currency = v; syncPressed('ob-cur', v); },
  'ob-lang': function (el, id, v) { S.settings.dateLang = v; syncPressed('ob-lang', v); },
  'ob-start': function () { S.settings.setupDone = true; saveStore(); goTab('home'); }
};
function shiftCal(dir) {
  var n = stepMonth(UI.cal, dir);
  if (!n) return;
  UI.cal = n;
  var t = todayDay(), tb = dayToBs(t);
  UI.calSel = tb.y === n.y && tb.m === n.m ? t : bsToDay(n.y, n.m, 1);
  renderView();
}
function shiftSum(dir) {
  var r = periodRange(UI.sum, UI.sumAnchor), n = dir < 0 ? r[0] - 1 : r[1] + 1;
  if (n < MIN_DAY || n > MAX_DAY) return;
  UI.sumAnchor = periodRange(UI.sum, n)[0];
  renderView();
}

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  var fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  fn(el, el.dataset.id, el.dataset.v);
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && sheets.length) closeSheet(); });
document.addEventListener('pointerdown', function (e) {
  var t = $('#toast');
  if (!t.classList.contains('show') || e.target.closest('#toast button')) return;
  if (e.target.closest('#toast') || e.target.closest('button, input, textarea, label, a')) hideToast();
}, true);

/* ================= Start ================= */
$$('.ti').forEach(function (s) { s.outerHTML = I[s.dataset.icon]; });
loadStore();
renderBanner();
renderView();
scheduleCleanup(4000);
var lastDay = todayDay();
setInterval(function () { if (todayDay() !== lastDay) { lastDay = todayDay(); refresh(); } }, 60000);
document.addEventListener('visibilitychange', function () { if (!document.hidden && todayDay() !== lastDay) { lastDay = todayDay(); refresh(); } });
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && !framed) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
})();
